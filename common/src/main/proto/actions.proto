syntax = "proto2";

package com.svartifoss.snfell.proto;

option java_package = "com.svartifoss.snfell.proto";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

message WatchActions {
  repeated ProtoButtonInfo actions = 1;
  required float volumeStep = 2;

  message ProtoButtonInfo {
    required bool physicalButton = 1;
    required int32 buttonIndex = 2;
    required int32 gesture = 3;
    optional string actionKey = 4;
    // Human-facing title resolved on the phone, including a user supplied custom title.
    // Older watches safely fall back to actionKey; older phone payloads simply omit it.
    optional string actionTitle = 5;
    // True for monochrome template glyphs that should follow the destination surface tint;
    // false for app artwork / gallery images whose original colours must be preserved.
    optional bool iconTintable = 6;
    // URI that must be opened on the paired phone through Wear RemoteIntent. Keeping this in the
    // action payload avoids Android's background-activity launch restriction on phone services.
    optional string remoteUri = 7;
    // Signed milliseconds the action moves playback by (the skip/reverse-by-seconds actions), so
    // the watch can draw the new position on the press instead of after the phone has run it.
    // Absent for every action that does not move it by a known amount; older phones never send
    // it, and older watches ignore it.
    optional sint64 seekOffsetMs = 8;
  }
}

message WatchList {
  repeated WatchListAction actions = 1;

  message WatchListAction {
    required string actionTitle = 1;
    optional string actionKey = 2;
    // Explicitly distinguishes monochrome templates from full-colour launcher/gallery artwork.
    optional bool iconTintable = 3;
    optional string remoteUri = 4;
    // True only for genuine fetched cover art (e.g. a streaming shortcut's cached thumbnail) -
    // never a generic app-launcher icon - eligible to fill a whole quick-panel pill's background.
    optional bool iconIsCoverArt = 5;
    // See ProtoButtonInfo.seekOffsetMs.
    optional sint64 seekOffsetMs = 6;
    // Set only for an entry that starts one particular streaming destination (a saved shortcut,
    // the account's liked songs): its service and kind ("YouTube Music • Playlist"), shown under
    // the name when the watch opens that shortcut's own screen with Play and Shuffle. Its presence
    // is what marks the entry as one that may open that screen; older phones never send it, so on
    // them every entry keeps starting at once.
    optional string shortcutSubtitle = 7;
    // Alongside shortcutSubtitle: whether that screen offers Shuffle beside Play.
    optional bool shortcutShuffleable = 8;
  }
}
