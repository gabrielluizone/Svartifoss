syntax = "proto2";

package com.svartifoss.snfell.proto;

option java_package = "com.svartifoss.snfell.proto";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

message WatchInfo {
  required bool roundWatch = 1;
  required float displayDensity = 2;
  repeated WatchButton buttons = 3;
  required int32 displayWidth = 4;
  required int32 displayHeight = 5;
  optional int64 time = 6;
  // Watch app version, so the phone's update screen can show whether the watch is outdated.
  // Absent when the watch runs a build from before these fields existed.
  optional int32 appVersionCode = 7;
  optional string appVersionName = 8;
  // HandGestureAvailability.code for Wear OS's primary one-handed gesture (double pinch).
  // Absent on watch builds from before the field, which the phone reads back as UNKNOWN - the
  // watch is the only side that can answer, and every failure of that input is otherwise silent.
  optional int32 handGesture = 9;

  message WatchButton {
    required string label = 1;
    optional int32 code = 2;
    optional bool supportsLongPress = 3 [default = true];
  }
}


