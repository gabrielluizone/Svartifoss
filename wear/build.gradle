apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: "kotlin-kapt"
apply plugin: "dagger.hilt.android.plugin"
apply plugin: 'de.mobilej.unmock'

android {
    defaultConfig {
        applicationId "com.svartifoss.snfell"
        namespace = "com.svartifoss.snfell"
        compileSdk 36
        // 26 required by androidx.wear.tiles (Tiles need Wear OS 2.x+; API 25 / Wear 2.0 is extinct).
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 135
        versionName "2.0"
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign with the debug config so local release builds produce an installable APK.
            // When keystore.properties exists, the root build.gradle afterEvaluate swaps the
            // debug config's credentials for the real keystore, so this also covers releases.
            signingConfig signingConfigs.debug
        }
    }
    buildFeatures {
        viewBinding true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        freeCompilerArgs += "-Xopt-in=kotlin.ExperimentalStdlibApi"
        freeCompilerArgs += "-Xopt-in=kotlinx.coroutines.ExperimentalCoroutinesApi"
    }
}

kotlin {
    jvmToolchain(21)
}

unMock {
    keep "android.widget.BaseAdapter"
    keep "android.widget.ArrayAdapter"
    keep "android.os.Bundle"
    keepStartingWith "android.database.MatrixCursor"
    keep "android.database.AbstractCursor"
    keep "android.database.CrossProcessCursor"
    keepStartingWith "android.util."
    keepStartingWith "android.text."
    keepStartingWith "android.content.ContentValues"
    keepStartingWith "android.content.ComponentName"
    keepStartingWith "android.content.ContentUris"
    keepStartingWith "android.content.ContentProviderOperation"
    keepStartingWith "android.content.ContentProviderResult"
    keepStartingWith "android.content.UriMatcher"
    keepStartingWith "android.content.Intent"
    keep "android.location.Location"
    keepStartingWith "android.content.res.Configuration"
    keepStartingWith "org."
    keepStartingWith "libcore."
    keepStartingWith "com.android.internal.R"
    keepStartingWith "com.android.internal.util."
    keep "android.net.Uri"
    keep "android.view.KeyEvent"

    keepAndRename "java.nio.charset.Charsets" to "xjava.nio.charset.Charsets"
}

dependencies {
    implementation(project(path: ':wearutils')) {
        exclude group: 'com.google.android.support', module: 'wearable'
    }
    implementation(project(path: ':common')) {
        exclude group: 'com.google.android.support', module: 'wearable'
    }

    compileOnly libs.google.wearableLibrary

    implementation libs.androidx.cardView
    implementation libs.androidx.appCompat
    implementation libs.androidx.core
    implementation libs.androidx.wear
    implementation libs.androidx.wear.input
    implementation libs.androidx.wear.ongoing
    implementation libs.androidx.media

    // Wear OS Tiles + ProtoLayout — glanceable quick-control surface (MediaTileService).
    implementation libs.androidx.wear.tiles
    implementation libs.androidx.wear.protolayout
    implementation libs.androidx.wear.protolayout.material
    implementation libs.androidx.wear.protolayout.expression
    implementation libs.androidx.wear.watchface.complications.datasource
    implementation libs.androidx.wear.watchface.complications.datasource.ktx
    // future { } coroutine builder -> ListenableFuture for TileService callbacks.
    implementation libs.kotlin.coroutines.guava

    // Jetpack Compose for Wear OS (first Compose in this module - pilots the redesign).
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.toolingPreview
    debugImplementation libs.androidx.compose.ui.tooling
    implementation libs.androidx.wear.compose.material3
    implementation libs.androidx.wear.compose.foundation
    implementation libs.androidx.activity.compose
    implementation libs.androidx.compose.runtime.livedata
    implementation libs.androidx.fragment
    implementation libs.androidx.palette
    implementation libs.androidx.activity
    implementation libs.androidx.preference
    implementation libs.androidx.hilt.runtime
    implementation libs.androidx.lifecycle.service
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.lifecycle.livedata
    coreLibraryDesugaring(libs.desugarJdkLibs)
    kapt libs.androidx.hilt.compiler

    implementation libs.google.playServices.wearable

    implementation libs.kotlin.coroutines
    implementation libs.kotlin.coroutines.playServices

    testImplementation libs.junit4
    testImplementation libs.kotlin.coroutines.test
    unmock libs.unmock.androidSource
}
repositories {
    mavenCentral()
}
