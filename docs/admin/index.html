<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Svartifoss · Community theme review</title>
  <style>
    :root {
      color-scheme: dark;
      --background: #101313;
      --surface: #1b211f;
      --surface-raised: #242d29;
      --line: #3b4742;
      --text: #eef3f0;
      --muted: #b6c3bc;
      --accent: #87a89f;
      --danger: #ffb4ab;
      --ok: #a4d4ad;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--background); color: var(--text); }
    button { font: inherit; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 56px; }
    header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.35rem); letter-spacing: -.035em; }
    h1 span { color: var(--accent); }
    .eyebrow { margin: 0 0 5px; color: var(--accent); font-size: .72rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .subtitle, .status { color: var(--muted); line-height: 1.5; }
    .subtitle { max-width: 660px; margin: 9px 0 0; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
    .auth { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: flex-end; min-width: 220px; }
    .user { color: var(--muted); font-size: .82rem; overflow-wrap: anywhere; text-align: right; }
    .button { min-height: 42px; border: 1px solid transparent; border-radius: 12px; padding: 0 15px; cursor: pointer; font-weight: 750; }
    .button:disabled { cursor: wait; opacity: .58; }
    .button.primary { background: var(--accent); color: #13201c; }
    .button.secondary { background: transparent; color: var(--text); border-color: var(--line); }
    .button.approve { background: var(--ok); color: #13351d; }
    .button.reject { background: transparent; color: var(--danger); border-color: #74443e; }
    .notice { margin: 20px 0; padding: 16px; border-radius: 15px; background: var(--surface-raised); border: 1px solid var(--line); color: var(--muted); line-height: 1.55; }
    .notice.error { border-color: #884c45; color: var(--danger); }
    .notice strong { color: var(--text); }
    .queue-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 30px 0 13px; }
    h2 { margin: 0; font-size: 1.1rem; }
    .count { color: var(--muted); font-size: .88rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 16px; }
    .card { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
    .preview { display: block; width: 100%; aspect-ratio: 1 / .72; object-fit: contain; background: #0c0f0e; }
    .preview.missing { display: grid; place-items: center; color: var(--danger); font-size: .82rem; padding: 20px; }
    .card-body { padding: 16px; }
    .card-title { margin: 0; font-size: 1.05rem; overflow-wrap: anywhere; }
    .byline, .meta { color: var(--muted); font-size: .84rem; line-height: 1.45; overflow-wrap: anywhere; }
    .byline { margin: 5px 0 13px; }
    .meta { margin: 0; }
    .meta.error { color: var(--danger); }
    .actions { display: flex; gap: 8px; margin-top: 17px; }
    .actions .button { flex: 1; }
    .submitted-json { margin-top: 14px; color: var(--muted); font-size: .8rem; }
    .submitted-json summary { cursor: pointer; }
    .submitted-json pre { max-height: 260px; overflow: auto; margin: 9px 0 0; padding: 10px; border-radius: 9px; background: #101513; color: var(--text); font: .72rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { padding: 38px 20px; text-align: center; color: var(--muted); }
    code { padding: .1em .35em; border-radius: 5px; background: #101513; color: var(--text); }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      header { flex-direction: column; }
      .auth { justify-content: flex-start; }
      .user { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <section>
        <p class="eyebrow">Svartifoss 3.3</p>
        <h1>Community theme <span>review</span></h1>
        <p class="subtitle">Approve or reject pending submissions. Approval only queues a GitHub publication; it never makes a theme public instantly.</p>
      </section>
      <section class="auth panel" aria-label="Moderator sign in">
        <span id="user" class="user">Not signed in</span>
        <button id="sign-in" class="button primary" type="button">Sign in with Google</button>
        <button id="sign-out" class="button secondary" type="button" hidden>Sign out</button>
      </section>
    </header>

    <section id="setup" class="notice" hidden></section>
    <section id="status" class="notice" aria-live="polite">Configure the review page, then sign in.</section>

    <section id="queue" hidden>
      <div class="queue-heading">
        <h2>Pending review</h2>
        <span id="count" class="count"></span>
      </div>
      <div id="cards" class="grid"></div>
    </section>
  </main>
  <script type="module" src="./admin.js"></script>
</body>
</html>
