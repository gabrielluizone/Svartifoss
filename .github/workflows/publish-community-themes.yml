name: Publish approved community themes

on:
  workflow_dispatch:
    inputs:
      refresh_likes:
        description: "Rewrite like counts even if the weekly refresh interval has not elapsed"
        type: boolean
        default: false
  schedule:
    - cron: "23 4 * * *"

# The workflow is intentionally not reachable from pull_request or push. It is the only path that
# uses the repository token to turn an approved Firestore document into a public Git commit.
permissions:
  contents: write

concurrency:
  group: community-theme-publisher-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    # workflow_dispatch can otherwise select another branch. Always execute the reviewed default
    # branch version, which is also what checkout below commits and pushes.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: .github/community-theme-publisher/package-lock.json

      - name: Install publisher dependencies
        run: npm ci --prefix .github/community-theme-publisher

      - name: Prepare approved themes
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: >-
          node .github/community-theme-publisher/publisher.mjs --publish
          --manifest "$RUNNER_TEMP/community-theme-publication.json"
          ${{ inputs.refresh_likes && '--refresh-likes' || '' }}

      - name: Commit and push the static catalogue
        run: |
          if git diff --quiet -- docs/themes; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/themes
          git commit -m "Publish approved community themes"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Finalize published intake documents
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: >-
          node .github/community-theme-publisher/publisher.mjs
          --finalize "$RUNNER_TEMP/community-theme-publication.json"
