import org.gradle.api.tasks.PathSensitivity
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: "kotlin-kapt"
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    defaultConfig {
        applicationId "com.svartifoss.snfell"
        namespace = "com.svartifoss.snfell"
        minSdkVersion 23
        // Google Play requires Android 16 / API 36 for mobile app updates from 31 August 2026.
        // Wear OS has a separate API-35 requirement and remains configured in wear/build.gradle.
        targetSdkVersion 36
        compileSdk 36
        versionCode 61
        versionName "3.3"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        wearAppUnbundled true
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign with the debug config so local release builds produce an installable APK.
            // When keystore.properties exists, the root build.gradle afterEvaluate swaps the
            // debug config's credentials for the real keystore, so this also covers releases.
            signingConfig signingConfigs.debug
        }
    }
    packagingOptions {
        exclude 'META-INF/gradle/*'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        viewBinding true
        buildConfig true
        aidl true
    }
    kotlinOptions {
        freeCompilerArgs += "-Xopt-in=kotlin.ExperimentalStdlibApi"
        freeCompilerArgs += "-Xopt-in=kotlinx.coroutines.DelicateCoroutinesApi"

    }
}

kapt {
    correctErrorTypes = true
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation project(path: ':wearutils')
    implementation project(path: ':common')

    implementation libs.androidx.preference
    implementation libs.androidx.viewpager2
    implementation libs.androidx.appCompat
    implementation libs.google.material
    implementation libs.androidx.constraintLayout
    implementation libs.androidx.core
    implementation libs.androidx.lifecycle.service
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.runtime
    implementation libs.androidx.credentials
    implementation libs.androidx.credentials.playServicesAuth
    implementation libs.androidx.media
    implementation libs.androidx.palette
    coreLibraryDesugaring(libs.desugarJdkLibs)

    implementation libs.google.playServices.wearable
    compileOnly libs.google.wearableLibrary
    // Provides RemoteIntent, used to open the watch app's Play Store listing from the phone
    // (MainActivity.openWatchPlayStorePage) - same artifact wearutils' WearCompanionPhoneActivity
    // already uses, but that's an `implementation` dep there so it isn't exposed transitively.
    implementation libs.google.wearableSupport

    implementation libs.kotlin.coroutines
    implementation libs.kotlin.coroutines.playServices

    //noinspection AnnotationProcessorOnCompilePath
    implementation libs.google.autoFactory
    kapt libs.google.autoFactory

    //noinspection AnnotationProcessorOnCompilePath
    implementation libs.google.autoValue
    implementation libs.google.autoValue.annotations
    kapt libs.google.autoValue

    implementation libs.dagger
    implementation libs.dagger.android
    implementation libs.dagger.android.support
    kapt libs.dagger.compiler
    kapt libs.dagger.android.processor

    implementation libs.advancedRecyclerView
    implementation libs.licensesDialog

    implementation platform(libs.google.firebase.bom)

    implementation libs.google.firebase.crashlytics
    implementation libs.google.firebase.analytics
    implementation libs.google.firebase.messaging
    implementation libs.google.firebase.auth
    implementation libs.google.firebase.firestore
    implementation libs.google.identity.googleid

    testImplementation libs.kotlin.coroutines.test
    testImplementation libs.junit4
    // Android's org.json is a runtime stub in local JVM tests; use the reference implementation
    // for the checked-in GitHub Pages catalogue contract test.
    testImplementation libs.json
}

// TranslatedArrayAlignmentTest reads res/values*/strings.xml straight off disk, which Gradle does
// not otherwise know is an input to the unit-test task - so editing a translation left the task
// UP-TO-DATE and the check silently stale. Declaring the directory makes any resource edit
// re-run it.
tasks.withType(Test).configureEach {
    inputs.dir("src/main/res")
            .withPropertyName("resourcesForTranslationTests")
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // The same trap, one module further out. WatchPreviewParityTest compares the preview's copy of
    // each face's geometry against the Wear face it mirrors, and `mobile` has no dependency on
    // `wear` at all - so nothing here would ever be invalidated by the very edit the check exists
    // to catch. Without this, changing a constant on the watch leaves the task UP-TO-DATE and the
    // drift is reported only on a clean build.
    inputs.dir("${rootProject.projectDir}/wear/src/main/java/com/svartifoss/snfell/watch/view/face")
            .withPropertyName("wearFaceSourcesForPreviewParity")
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // And once more for the public community-theme contract, which lives in `common`.
    // CommunityThemeVocabularyParityTest reads it beside this module's arrays, so without this a
    // value set left short of its picker keeps reporting UP-TO-DATE - which is the exact way the
    // fonts and the two new AOD styles went missing from it unnoticed.
    inputs.file("${rootProject.projectDir}/common/src/main/assets/community-theme-constraints.json")
            .withPropertyName("communityThemeConstraintsAsset")
            .withPathSensitivity(PathSensitivity.RELATIVE)

    // The author-screenshot contract, which is neither Kotlin nor in any module.
    // CommunityThemeScreenshotContractTest reads the security rules and the Node publisher to keep
    // their bounds in step with what the phone encodes. Both sit at the repository root, so without
    // these an edit to either leaves the task UP-TO-DATE and the drift surfaces as a bare
    // PERMISSION_DENIED on somebody's submission instead of as a failing test.
    inputs.file("${rootProject.projectDir}/firestore.rules")
            .withPropertyName("firestoreRulesForScreenshotContract")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file("${rootProject.projectDir}/.github/community-theme-publisher/publisher.mjs")
            .withPropertyName("communityThemePublisherForScreenshotContract")
            .withPathSensitivity(PathSensitivity.RELATIVE)
}
