apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: "kotlin-kapt"
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'

android {
    defaultConfig {
        applicationId "com.svartifoss.snfell"
        namespace = "com.svartifoss.snfell"
        minSdkVersion 23
        targetSdkVersion 34
        compileSdk 36
        versionCode 29
        versionName "2.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        wearAppUnbundled true
        multiDexEnabled true
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Sign with the debug config so local release builds produce an installable APK.
            // When keystore.properties exists, the root build.gradle afterEvaluate swaps the
            // debug config's credentials for the real keystore, so this also covers releases.
            signingConfig signingConfigs.debug
        }
    }
    packagingOptions {
        exclude 'META-INF/gradle/*'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }
    buildFeatures {
        viewBinding true
        aidl true
    }
    kotlinOptions {
        freeCompilerArgs += "-Xopt-in=kotlin.ExperimentalStdlibApi"
        freeCompilerArgs += "-Xopt-in=kotlinx.coroutines.DelicateCoroutinesApi"

    }
}

kapt {
    correctErrorTypes = true
}

kotlin {
    jvmToolchain(21)
}

dependencies {
    implementation project(path: ':wearutils')
    implementation project(path: ':common')

    implementation libs.androidx.preference
    implementation libs.androidx.appCompat
    implementation libs.google.material
    implementation libs.androidx.constraintLayout
    implementation libs.androidx.core
    implementation libs.androidx.lifecycle.service
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.media
    implementation libs.androidx.palette
    coreLibraryDesugaring(libs.desugarJdkLibs)

    implementation libs.google.playServices.wearable
    compileOnly libs.google.wearableLibrary

    implementation libs.kotlin.coroutines
    implementation libs.kotlin.coroutines.playServices

    //noinspection AnnotationProcessorOnCompilePath
    implementation libs.google.autoFactory
    kapt libs.google.autoFactory

    //noinspection AnnotationProcessorOnCompilePath
    implementation libs.google.autoValue
    implementation libs.google.autoValue.annotations
    kapt libs.google.autoValue

    implementation libs.dagger
    implementation libs.dagger.android
    implementation libs.dagger.android.support
    kapt libs.dagger.compiler
    kapt libs.dagger.android.processor

    implementation libs.advancedRecyclerView
    implementation libs.licensesDialog

    implementation platform(libs.google.firebase.bom)

    implementation libs.google.firebase.crashlytics

    testImplementation libs.junit4
}
